name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ("${{ github.ref_name }}" -ne "v$version") {
            throw "Release tag must match package.json version (v$version)"
          }

      - name: Run smoke check
        run: npm run verify

      - name: Build Windows installer and portable app
        run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/InfiniteWeb Setup *.exe
            release/InfiniteWeb *.exe
